name: Reproducibility checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --frozen
      - name: Check publishable files for credentials and raw snapshots
        run: |
          git ls-files -z > /tmp/orglens-tracked-files
          uv run --frozen python scripts/check_secrets.py --file-list /tmp/orglens-tracked-files
      - run: uv run --frozen pytest -q
      - run: uv run --frozen orglens --help
