<style>
/* Concept: a nautical chart of a company. Every fact is a charted position with a bearing back to its source; what nobody has checked is drawn as unsurveyed water. */
:root{
  --water:#F3F8F9;--shoal:#DDECF1;--land:#F2E8CC;--paper:#FFFFFF;--ink:#10303C;--muted:#49646E;--line:#B9CFD6;
  --mark:#A3115C;--mark-soft:#F7E3EE;--good:#0C6B58;--warn:#8A5A00;--bad:#B3261E;--hatch:#9DB9C2;
  --ui:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;--note:"Newsreader",Georgia,serif;--fig:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;
  --r:3px;--quick:160ms;--bearing:520ms;--ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--water:#0B1A22;--shoal:#12303C;--land:#2B2A1E;--paper:#0F232D;--ink:#E4EEF1;--muted:#9DB6BF;--line:#2B4C59;--mark:#F27AB3;--mark-soft:#3A1830;--good:#5FD0B5;--warn:#E6B85C;--bad:#F2938B;--hatch:#3C6070;color-scheme:dark}}
:root[data-theme="dark"]{--water:#0B1A22;--shoal:#12303C;--land:#2B2A1E;--paper:#0F232D;--ink:#E4EEF1;--muted:#9DB6BF;--line:#2B4C59;--mark:#F27AB3;--mark-soft:#3A1830;--good:#5FD0B5;--warn:#E6B85C;--bad:#F2938B;--hatch:#3C6070;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--water);color:var(--ink);font:400 16px/1.5 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--water)}
.wrap{max-width:1160px;margin-inline:auto}
a{color:inherit;text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--water);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:center;padding-block:var(--s3);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:var(--s2);background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;gap:var(--s1);flex-wrap:wrap}
.nav button{background:none;border:0;min-height:44px;padding-inline:var(--s3);cursor:pointer;color:var(--muted);font-weight:500;border-radius:var(--r)}
.nav button:hover{color:var(--ink);background:var(--shoal)}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--mark);border-radius:0}
.ref{margin-left:auto;font:italic 400 15px var(--note);color:var(--muted)}
.view{padding-top:var(--s6)}
h1,h2,h3{text-wrap:balance;margin:0}
.note{font:italic 400 1.05em/1.4 var(--note);color:var(--muted)}
.num{font-family:var(--fig);font-variant-numeric:tabular-nums}
/* Home */
.hero{position:relative;display:grid;gap:var(--s6);padding-block:var(--s5) var(--s7);isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero h1{font-size:clamp(38px,7vw,76px);line-height:1;font-weight:800;letter-spacing:-.035em;max-width:13ch}
.hero .lede{max-width:52ch;font-size:18px;margin:var(--s4) 0 0}
.bearing{display:grid;grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);align-items:center;max-width:860px}
.chartcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);min-width:0}
.chartcard .big{font:500 clamp(24px,4vw,34px)/1.1 var(--fig);letter-spacing:-.02em;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.line{height:2px;background:repeating-linear-gradient(90deg,var(--mark) 0 8px,transparent 8px 13px);transform-origin:left;animation:draw var(--bearing) var(--ease) .25s both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.search{display:grid;gap:var(--s2);max-width:720px}
.search label{font-weight:600}
.search input{width:100%;min-height:56px;padding-inline:var(--s4);font-size:18px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r)}
.results{display:grid;margin-top:var(--s5);border-top:1px solid var(--line)}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2) var(--s4);padding-block:var(--s3);border-bottom:1px solid var(--line);align-items:center}
.result button.open{all:unset;cursor:pointer;display:block;min-width:0}
.result button.open:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.result strong{font-weight:700;font-size:17px;display:block;overflow-wrap:anywhere}
.result strong:hover{color:var(--mark)}
.btn{min-height:44px;padding-inline:var(--s4);border:1px solid var(--ink);background:transparent;border-radius:var(--r);font-weight:600;cursor:pointer;transition:background var(--quick),color var(--quick)}
.btn:hover{background:var(--ink);color:var(--water)}
.btn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--paper)}
/* Fix mark: the chart symbol for a confirmed position. */
.fix{appearance:none;border:0;background:none;width:44px;height:44px;margin:-12px -8px -12px -6px;padding:0;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;flex:none;border-radius:50%}
.fix i{display:block;width:16px;height:16px;border:1.5px solid var(--mark);border-radius:50%;position:relative;transition:transform var(--quick) var(--ease),background var(--quick)}
.fix i::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--mark);transition:background var(--quick)}
.fix:hover i{transform:scale(1.25);background:var(--mark)}
.fix:hover i::after{background:var(--paper)}
/* Unsurveyed: absence has its own texture, so it can never read as zero. */
.unsurveyed{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 6px);border:1px dashed var(--hatch);border-radius:var(--r);padding:var(--s2) var(--s3)}
.unsurveyed span{background:var(--water);padding:1px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.state{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s1)}
/* Profile */
.head{display:grid;gap:var(--s2);padding-bottom:var(--s5);border-bottom:2px solid var(--ink)}
.head h1{font-size:clamp(30px,5.5vw,56px);line-height:1.02;letter-spacing:-.03em;font-weight:800;overflow-wrap:anywhere}
.cols{display:grid;gap:var(--s6);padding-top:var(--s5);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) 280px}.rail{position:sticky;top:88px;align-self:start}}
section.block{display:grid;gap:var(--s3);padding-bottom:var(--s6);min-width:0}
section.block h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
.story{display:grid;gap:var(--s3);max-width:65ch;font-size:17px}
.story p{margin:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:var(--s2) var(--s3);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
thead th{font-weight:600;font-size:13px;color:var(--muted)}
td.neg{color:var(--bad)}
.list{display:grid}
.row{display:flex;justify-content:space-between;gap:var(--s4);padding-block:var(--s2);border-bottom:1px solid var(--line);align-items:center;min-height:44px}
.row>div{min-width:0;overflow-wrap:anywhere}
.rail h2{font-size:15px;font-weight:700;margin-bottom:var(--s2)}
.survey{display:grid;grid-template-columns:18px minmax(0,1fr);gap:var(--s2);padding-block:6px;font-size:14px;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--good)}
.dot.no{background:repeating-linear-gradient(135deg,transparent 0 2px,var(--muted) 2px 3px);border:1px solid var(--muted)}
.dot.warn{background:var(--warn);border-radius:0;transform:rotate(45deg)}
/* Compare */
.pickers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);position:sticky;top:60px;background:var(--water);z-index:3;padding-block:var(--s3);border-bottom:2px solid var(--ink)}
.pickers label{display:grid;gap:var(--s1);min-width:0;font-size:13px;color:var(--muted);font-weight:500}
.pickers select{width:100%;min-height:48px;padding-inline:var(--s2);background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:var(--r);font-weight:700;font-size:15px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--s3);padding-block:var(--s3);border-bottom:1px solid var(--line)}
.cmp .lab{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:var(--s1)}
.cmp .cell{min-width:0;overflow-wrap:anywhere}
.val{display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap;font-family:var(--fig);font-size:clamp(15px,2.4vw,19px)}
.val.text{font-family:var(--ui);font-size:15px}
.bar{height:10px;margin-top:6px;background:var(--shoal);position:relative;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform var(--bearing) var(--ease)}
.bar b.loss{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 5px);border:1px solid var(--bad)}

.tray .btn{border-color:var(--water);color:var(--water)}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);z-index:20}
.sheet{position:fixed;z-index:21;background:var(--paper);display:grid;align-content:start;gap:var(--s3);overflow:auto;padding:var(--s5) max(var(--s5),env(safe-area-inset-right,0px)) calc(var(--s5) + env(safe-area-inset-bottom,0px)) var(--s5);bottom:0;left:0;right:0;max-height:88%;border-top:3px solid var(--mark);animation:rise 220ms var(--ease)}

.sheet h2{font-size:15px;font-weight:600;color:var(--muted)}
.sheet .answer{font:500 24px/1.2 var(--fig);overflow-wrap:anywhere}
.sheet dl{margin:0;display:grid;gap:var(--s3)}
.sheet dt{font-size:13px;font-weight:600;color:var(--muted)}
.sheet dd{margin:0;overflow-wrap:anywhere}
.sheet .x{justify-self:end}
/* System */
.sys{display:grid;gap:var(--s7)}
.sys h2{font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;font-weight:800;margin-bottom:var(--s2)}
.sys p{margin:0 0 var(--s3);max-width:65ch}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
.sw{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper);font-size:13px}
.sw i{display:block;height:64px}
.sw div{padding:var(--s2)}
.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}

.grid12 i{height:72px;background:var(--mark-soft);border:1px solid var(--mark)}
.grid12 i:nth-child(n+5){display:none}
@media (min-width:760px){.grid12 i:nth-child(n+5){display:block}}
.space{display:flex;align-items:flex-end;gap:var(--s3);flex-wrap:wrap}
.space i{display:block;background:var(--mark)}
.space div{display:grid;gap:var(--s1);font:12px var(--fig);justify-items:center}
.flow{display:grid;gap:var(--s3);padding:0;margin:0;list-style:none;counter-reset:s;max-width:70ch}
.flow li{counter-increment:s;display:grid;grid-template-columns:32px minmax(0,1fr)}
.flow li::before{content:counter(s);font:500 15px var(--fig);color:var(--mark)}
.decisions{display:grid;gap:var(--s4)}
.decisions div{border-top:1px solid var(--line);padding-top:var(--s3);max-width:70ch}
.decisions strong{display:block}
@media (max-width:899px){.ref{display:none}}
@media (max-width:640px){.top{position:static;padding-block:var(--s2)}.nav button{padding-inline:var(--s2)}.pickers{top:0}
.bearing{grid-template-columns:minmax(0,1fr);justify-items:start}.bearing .chartcard{width:100%}.bearing .line{width:2px;height:36px;margin-left:var(--s5);background:repeating-linear-gradient(180deg,var(--mark) 0 8px,transparent 8px 13px);transform-origin:top;animation-name:drop}}
@keyframes drop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
